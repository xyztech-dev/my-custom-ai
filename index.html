<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Custom AI Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1e293b; padding: 12px 15px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid #334155; }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 1.1rem; color: #38bdf8; }
        #api-key-input { background: #0f172a; border: 1px solid #475569; color: white; padding: 6px 10px; border-radius: 6px; font-size: 0.85rem; width: 100%; outline: none; }
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 0.95rem; word-break: break-word; }
        .user { background: #0284c7; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot { background: #334155; color: #f8fafc; align-self: flex-start; border-bottom-left-radius: 2px; }
        #input-form { background: #1e293b; padding: 12px; display: flex; gap: 10px; border-top: 1px solid #334155; }
        input[type="text"] { flex: 1; background: #0f172a; border: 1px solid #475569; color: white; padding: 10px 14px; border-radius: 8px; outline: none; font-size: 1rem; }
        input:focus, #api-key-input:focus { border-color: #38bdf8; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button:hover { background: #7dd3fc; }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <h1>My Custom AI Studio</h1>
        </div>
        <input type="password" id="api-key-input" placeholder="Paste your Gemini API Key here...">
    </header>

    <div id="chat-container">
        <div class="message bot">Hello! Paste your Gemini API key above and start chatting with your custom AI.</div>
    </div>

    <form id="input-form">
        <input type="text" id="user-input" placeholder="Ask anything..." autocomplete="off" required>
        <button type="submit" id="send-btn">Send</button>
    </form>

    <script type="module">
        import { GoogleGenAI } from "https://esm.run/@google/genai";

        const chatContainer = document.getElementById('chat-container');
        const inputForm = document.getElementById('input-form');
        const userInput = document.getElementById('user-input');
        const apiKeyInput = document.getElementById('api-key-input');

        inputForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            const apiKey = apiKeyInput.value.trim();

            if (!text) return;
            if (!apiKey) {
                alert("Please enter your Gemini API key in the top box first!");
                return;
            }

            appendMessage(text, 'user');
            userInput.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const loadingId = appendMessage('Thinking...', 'bot');

            try {
                const ai = new GoogleGenAI({ apiKey: apiKey });
                const response = await ai.models.generateContent({
                    model: 'gemini-2.5-flash',
                    contents: text,
                });

                document.getElementById(loadingId).innerText = response.text || "No response generated.";
                chatContainer.scrollTop = chatContainer.scrollHeight;
            } catch (err) {
                document.getElementById(loadingId).innerText = `Error: ${err.message}`;
            }
        });

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            const id = 'msg-' + Date.now();
            msgDiv.id = id;
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }
    </script>
</body>
</html>
